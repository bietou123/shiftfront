apply plugin: 'com.android.application'

android {
    namespace 'com.shiftfront.game'
    compileSdk 37

    defaultConfig {
        applicationId 'com.shiftfront.game'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
